name: Bug or difference from the arcade game (English)
description: Report gameplay, graphics, audio, performance, or loading problems in English.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: If you built the image, add its SHA-256.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where it happens
      options:
        - Physical Saturn
        - Mednafen
        - Other emulator
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Equipment and configuration
      description: Model/region, loading method, cartridges, and controllers; or emulator version and settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Mode, stage, and sequence of actions. Describe what happens and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks or supporting material
      description: Logs or a short recording if helpful. Do not attach ROMs, BIOS files, or disc images.
